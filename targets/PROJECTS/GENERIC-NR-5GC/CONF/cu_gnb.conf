Active_gNBs = ( "gNB-Eurecom-CU");
# Asn1_verbosity, choice in: none, info, annoying
Asn1_verbosity = "none";

gNBs =
(
 {
    ////////// Identification parameters:
    gNB_ID = 0xe00;

#     cell_type =  "CELL_MACRO_GNB";

    gNB_name  =  "gNB-Eurecom-CU";

    // Tracking area code, 0x0000 and 0xfffe are reserved values
    tracking_area_code  =  1;
    plmn_list = ({ mcc = 208; mnc = 93; mnc_length = 2; snssaiList = ({ sst = 1 , sd = 0x010203 }) });

    nr_cellid = 12345678L;

    tr_s_preference = "f1";

    local_s_address = "127.0.0.4";
    remote_s_address = "127.0.0.5";
    local_s_portc   = 501;
    local_s_portd   = 2156;
    remote_s_portc  = 500;
    remote_s_portd  = 2153;

    # ------- SCTP definitions
    SCTP :
    {
        # Number of streams to use in input/output
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };


    ////////// AMF parameters:
    amf_ip_address = ({ ipv4 = "127.0.0.18"; });

    NETWORK_INTERFACES :
    {

        GNB_IPV4_ADDRESS_FOR_NG_AMF = "127.0.0.4";
        GNB_IPV4_ADDRESS_FOR_NGU    = "127.0.0.4";
        GNB_PORT_FOR_S1U                         = 2152; # Spec 2152
    };
  }
);

/* ── PDCP latency tuning ───────────────────────────────────────────────── */
pdcp = {
  drb = {
    sn_size       = "len18bits"
    t_reordering  = "ms30"       # default ms100 — reduce reorder wait
    discard_timer = "ms150"      # default infinity — drop stale packets
  }
}

/* ── RRC timers ─────────────────────────────────────────────────────────── */
# t310: RLF detection window. Default 2000ms → faster failure detection.
# n310: consecutive out-of-sync indications before T310 starts.
# t311: re-establishment timeout.
uiTimersAndConstants = {
  t300 = 400;
  t310 = 500;    # default 2000
  n310 = 4;      # default 10
  t311 = 1500;   # default 3000
  n311 = 1;
}

security = {
  # preferred ciphering algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nea0, nea1, nea2, nea3
  ciphering_algorithms = ( "nea0" );

  # preferred integrity algorithms
  # the first one of the list that an UE supports in chosen
  # valid values: nia0, nia1, nia2, nia3
  integrity_algorithms = ( "nia2", "nia0" );

  # setting 'drb_ciphering' to "no" disables ciphering for DRBs, no matter
  # what 'ciphering_algorithms' configures; same thing for 'drb_integrity'
  drb_ciphering = "yes";
  drb_integrity = "no";
};
     log_config :
     {
       global_log_level                      ="warn";
       hw_log_level                          ="warn";
       phy_log_level                         ="warn";
       mac_log_level                         ="warn";
       rlc_log_level                         ="warn";
       pdcp_log_level                        ="warn";
       rrc_log_level                         ="warn";
       f1ap_log_level                        ="warn";
       ngap_log_level                        ="warn";
    };

e2_agent = {
  near_ric_ip_addr = "192.168.0.202";
  #sm_dir = "/path/where/the/SMs/are/located/"
  sm_dir = "/usr/local/lib/flexric/"
};
